<script>
    // Si el navegador restaura esta página desde su caché al pulsar "Atrás"
    // (por ejemplo, después de cerrar sesión), la recargamos para que el
    // servidor compruebe la sesión y redirija al login si ya no existe.
    window.addEventListener("pageshow", function (event) {
        if (event.persisted) window.location.reload();
    });
</script>
