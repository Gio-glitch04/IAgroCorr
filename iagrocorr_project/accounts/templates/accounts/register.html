<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAgroCorr - Registro</title>
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary-green: #1a4d2e; --light-green: #2d6a4f; --text-muted: #6c757d; }
        body, html { height: 100%; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg-image { background-image: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1920&auto=format&fit=crop'); background-size: cover; background-position: center; height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        .bg-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.2); }
        .login-card { background-color: #ffffff; border-radius: 12px; padding: 3rem 2.5rem; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); position: relative; z-index: 1; }
        .logo-text { color: var(--primary-green); font-weight: 700; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem; }
        .form-label { font-weight: 600; font-size: 0.85rem; color: #333; margin-bottom: 0.25rem;}
        .input-group-text { background-color: transparent; border-right: none; color: var(--text-muted); }
        .form-control { border-left: none; }
        .form-control:focus { box-shadow: none; border-color: #dee2e6; }
        .input-group:focus-within { box-shadow: 0 0 0 0.25rem rgba(26, 77, 46, 0.25); border-radius: 0.375rem; }
        .input-group:focus-within .input-group-text, .input-group:focus-within .form-control { border-color: var(--primary-green); }
        .btn-primary-custom { background-color: var(--primary-green); border: none; padding: 0.75rem; font-weight: 500; width: 100%; border-radius: 6px; margin-top: 1rem; transition: all 0.3s ease; }
        .btn-primary-custom:hover { background-color: var(--light-green); }
        .divider { height: 1px; background-color: #e9ecef; margin: 1.5rem 0; }
        .request-access { color: var(--primary-green); font-weight: 700; text-decoration: none; }
        .secure-env { font-size: 0.75rem; color: #adb5bd; text-align: center; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="bg-image">
        <div class="bg-overlay"></div>
        <div class="login-card">
            <div class="logo-text">
                <i class="bi bi-tractor"></i> IAgroCorr
            </div>
            <div class="subtitle mt-2">Crea tu cuenta en el Portal</div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show py-2" style="font-size: 0.85rem;" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ message }}
                        <button type="button" class="btn-close pb-2" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="nameInput" class="form-label">Nombre de Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="nameInput" name="nameInput" value="{{ nombre_usuario|default:'' }}" placeholder="tu_usuario" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <label for="firstNameInput" class="form-label">Nombre(s)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                            <input type="text" class="form-control" id="firstNameInput" name="firstNameInput" value="{{ nombres|default:'' }}" placeholder="Juan" required>
                        </div>
                    </div>
                    <div class="col-6 mb-3">
                        <label for="lastNameInput" class="form-label">Apellido(s)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                            <input type="text" class="form-control" id="lastNameInput" name="lastNameInput" value="{{ apellidos|default:'' }}" placeholder="Pérez" required>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="emailInput" class="form-label">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="emailInput" name="emailInput" value="{{ correo|default:'' }}" placeholder="nombre@mail.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="passwordInput" class="form-label mb-0">Contraseña</label>
                    <div class="input-group mt-1">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="passwordInput" name="passwordInput" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary border-start-0 border-top border-bottom border-end text-muted" type="button" id="togglePassword" style="background: transparent;">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    
                    <div class="progress mt-2" style="height: 5px;">
                        <div id="password-strength-bar" class="progress-bar bg-danger" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                    <div id="password-strength-text" class="text-muted mt-1" style="font-size: 0.75rem;">Fuerza de la contraseña</div>
                </div>

                <button type="submit" class="btn btn-primary-custom text-white mt-2">
                    Registrarse <i class="bi bi-check2-circle ms-1"></i>
                </button>
            </form>

            <div class="divider"></div>

            <div class="d-flex justify-content-between align-items-center" style="font-size: 0.9rem;">
                <span class="text-muted">¿Ya tienes una cuenta?</span>
                <a href="{% url 'login' %}" class="request-access">Inicia Sesión</a>
            </div>

            <div class="secure-env">
                <i class="bi bi-shield-check"></i> Secure Enterprise Environment
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#passwordInput');
        
        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.querySelector('i').classList.toggle('bi-eye');
            this.querySelector('i').classList.toggle('bi-eye-slash');
        });

        const strengthBar = document.getElementById('password-strength-bar');
        const strengthText = document.getElementById('password-strength-text');

        password.addEventListener('input', function() {
            const val = password.value;
            let score = 0;

            if (val.length > 7) score += 25;
            if (val.match(/[a-z]/) && val.match(/[A-Z]/)) score += 25;
            if (val.match(/\d/)) score += 25;
            if (val.match(/[^a-zA-Z\d]/)) score += 25;

            strengthBar.style.width = score + '%';

            if (val.length === 0) {
                strengthBar.className = 'progress-bar bg-danger';
                strengthBar.style.width = '0%';
                strengthText.innerHTML = 'Fuerza de la contraseña';
                strengthText.className = 'text-muted mt-1';
            } else if (score < 50) {
                strengthBar.className = 'progress-bar bg-danger';
                strengthText.innerHTML = 'Débil (Usa mínimo 8 caracteres, números y mayúsculas)';
                strengthText.className = 'text-danger mt-1';
            } else if (score >= 50 && score < 100) {
                strengthBar.className = 'progress-bar bg-warning';
                strengthText.innerHTML = 'Media (Agrega algún símbolo como @, #, $ para mejorar)';
                strengthText.className = 'text-warning mt-1';
            } else if (score === 100) {
                strengthBar.className = 'progress-bar bg-success';
                strengthText.innerHTML = 'Fuerte ¡Excelente!';
                strengthText.className = 'text-success mt-1';
            }
        });
    </script>
</body>
</html>
