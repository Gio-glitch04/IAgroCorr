<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAgroCorr - Página no encontrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        /* Variables y tipografía corporativa */
        :root {
            --primary-green: #1a4d2e;
            --light-green: #2d6a4f;
            --text-muted: #6c757d;
        }
        
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Fondo de pantalla agrícola */
        .bg-image {
            background-image: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Capa oscura semi-transparente sobre el fondo */
        .bg-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4); /* Un poco más oscuro para resaltar la tarjeta */
        }

        /* Tarjeta central */
        .error-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 1;
            text-align: center; /* Centramos todo el contenido */
        }

        /* Estilos de texto y botones reutilizados */
        .logo-text {
            color: var(--primary-green);
            font-weight: 700;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: var(--primary-green);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .btn-primary-custom {
            background-color: var(--primary-green);
            border: none;
            padding: 0.75rem;
            font-weight: 500;
            width: 100%;
            border-radius: 6px;
            transition: all 0.3s ease;
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary-custom:hover {
            background-color: var(--light-green);
            color: white;
        }
    </style>
</head>
<body>
    <div class="bg-image">
        <div class="bg-overlay"></div>
        <div class="error-card">
            <div class="logo-text">
                <i class="bi bi-globe-americas"></i> IAgroCorr
            </div>
            
            <div class="error-code">404</div>
            <h4 class="fw-bold text-dark mt-3">¡Te has salido del lote!</h4>
            <p class="subtitle">La página que buscas no existe, ha sido movida o te encuentras fuera del área cultivable.</p>
            
            <a href="{% url 'dashboard' %}" class="btn-primary-custom">
                <i class="bi bi-house-door-fill me-2"></i> Volver a Terreno Conocido
            </a>
        </div>
    </div>
</body>
</html>
