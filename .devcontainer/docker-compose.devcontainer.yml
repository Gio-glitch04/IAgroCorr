# Ajustes del servicio web solo para el Dev Container de VS Code.
# El servidor Django arranca solo (mismo comando que docker-compose.yml)
# y se recarga al guardar cambios en el codigo.
services:
  web:
    volumes:
      # Las rutas se resuelven desde la raiz del repo (carpeta del primer compose)
      - .:/workspace:cached
    working_dir: /workspace/iagrocorr_project
